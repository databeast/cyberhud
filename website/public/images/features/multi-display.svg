<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
    <rect width="600" height="400" fill="hsl(220, 10%, 12%)"/>
    <rect x="20" y="20" width="560" height="360" fill="none" stroke="hsl(180, 100%, 50%)" stroke-width="2"
          stroke-dasharray="8 4" rx="4"/>
    <!-- Three display panels -->
    <rect x="80" y="120" width="120" height="90" rx="4" fill="none" stroke="hsl(180, 100%, 50%)" stroke-width="1.5"/>
    <rect x="240" y="100" width="120" height="90" rx="4" fill="none" stroke="hsl(300, 100%, 55%)" stroke-width="1.5"/>
    <rect x="400" y="120" width="120" height="90" rx="4" fill="none" stroke="hsl(180, 100%, 50%)" stroke-width="1.5"/>
    <!-- Screen content lines -->
    <line x1="95" y1="140" x2="175" y2="140" stroke="hsl(180, 100%, 50%)" stroke-width="1" opacity="0.5"/>
    <line x1="95" y1="155" x2="160" y2="155" stroke="hsl(180, 100%, 50%)" stroke-width="1" opacity="0.3"/>
    <line x1="95" y1="170" x2="170" y2="170" stroke="hsl(180, 100%, 50%)" stroke-width="1" opacity="0.5"/>
    <line x1="255" y1="120" x2="335" y2="120" stroke="hsl(300, 100%, 55%)" stroke-width="1" opacity="0.5"/>
    <line x1="255" y1="135" x2="320" y2="135" stroke="hsl(300, 100%, 55%)" stroke-width="1" opacity="0.3"/>
    <line x1="255" y1="150" x2="340" y2="150" stroke="hsl(300, 100%, 55%)" stroke-width="1" opacity="0.5"/>
    <line x1="415" y1="140" x2="495" y2="140" stroke="hsl(180, 100%, 50%)" stroke-width="1" opacity="0.5"/>
    <line x1="415" y1="155" x2="480" y2="155" stroke="hsl(180, 100%, 50%)" stroke-width="1" opacity="0.3"/>
    <line x1="415" y1="170" x2="490" y2="170" stroke="hsl(180, 100%, 50%)" stroke-width="1" opacity="0.5"/>
    <!-- Connection lines to central Pi -->
    <line x1="140" y1="210" x2="300" y2="280" stroke="hsl(180, 100%, 50%)" stroke-width="0.5" opacity="0.4"/>
    <line x1="300" y1="190" x2="300" y2="280" stroke="hsl(300, 100%, 55%)" stroke-width="0.5" opacity="0.4"/>
    <line x1="460" y1="210" x2="300" y2="280" stroke="hsl(180, 100%, 50%)" stroke-width="0.5" opacity="0.4"/>
    <!-- Pi symbol -->
    <circle cx="300" cy="290" r="15" fill="none" stroke="hsl(180, 100%, 50%)" stroke-width="1"/>
    <text x="300" y="295" text-anchor="middle" font-family="monospace" font-size="12" fill="hsl(180, 100%, 50%)">Pi
    </text>
    <text x="300" y="350" text-anchor="middle" font-family="monospace" font-size="13" fill="hsl(0, 0%, 45%)">
        MULTI-DISPLAY
    </text>
</svg>
