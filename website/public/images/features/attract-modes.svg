<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
    <rect width="600" height="400" fill="hsl(220, 10%, 12%)"/>
    <rect x="20" y="20" width="560" height="360" fill="none" stroke="hsl(180, 100%, 50%)" stroke-width="2"
          stroke-dasharray="8 4" rx="4"/>
    <!-- Bokeh circles -->
    <circle cx="150" cy="160" r="35" fill="none" stroke="hsl(300, 100%, 55%)" stroke-width="1" opacity="0.6"/>
    <circle cx="150" cy="160" r="20" fill="hsl(300, 100%, 55%)" opacity="0.1"/>
    <circle cx="350" cy="140" r="45" fill="none" stroke="hsl(180, 100%, 50%)" stroke-width="1" opacity="0.5"/>
    <circle cx="350" cy="140" r="28" fill="hsl(180, 100%, 50%)" opacity="0.08"/>
    <circle cx="450" cy="220" r="30" fill="none" stroke="hsl(300, 100%, 55%)" stroke-width="1" opacity="0.4"/>
    <circle cx="450" cy="220" r="16" fill="hsl(300, 100%, 55%)" opacity="0.1"/>
    <circle cx="200" cy="260" r="25" fill="none" stroke="hsl(180, 100%, 50%)" stroke-width="1" opacity="0.5"/>
    <circle cx="200" cy="260" r="12" fill="hsl(180, 100%, 50%)" opacity="0.1"/>
    <circle cx="500" cy="130" r="18" fill="none" stroke="hsl(180, 100%, 50%)" stroke-width="0.8" opacity="0.3"/>
    <circle cx="100" cy="300" r="22" fill="none" stroke="hsl(300, 100%, 55%)" stroke-width="0.8" opacity="0.3"/>
    <!-- Particle dots -->
    <circle cx="280" cy="200" r="2" fill="hsl(180, 100%, 50%)" opacity="0.7"/>
    <circle cx="320" cy="250" r="1.5" fill="hsl(300, 100%, 55%)" opacity="0.6"/>
    <circle cx="400" cy="300" r="2" fill="hsl(180, 100%, 50%)" opacity="0.5"/>
    <circle cx="180" cy="180" r="1.5" fill="hsl(300, 100%, 55%)" opacity="0.6"/>
    <circle cx="420" cy="160" r="1" fill="hsl(180, 100%, 50%)" opacity="0.4"/>
    <text x="300" y="350" text-anchor="middle" font-family="monospace" font-size="13" fill="hsl(0, 0%, 45%)">ATTRACT
        MODES
    </text>
</svg>
