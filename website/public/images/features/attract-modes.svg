<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
    <style>
        .cube-spin {
            transform-box: fill-box;
            transform-origin: center;
            animation: spin 12s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .cube-spin {
                animation: none;
            }
        }
    </style>
    <rect width="600" height="400" fill="hsl(220, 10%, 12%)"/>
    <rect x="20" y="20" width="560" height="360" fill="none" stroke="hsl(180, 100%, 50%)" stroke-width="2"
          stroke-dasharray="8 4" rx="4"/>
    <path d="M75 310h450M300 75v250" stroke="hsl(180, 100%, 50%)" stroke-width="1" opacity=".12"/>
    <circle cx="300" cy="195" r="115" fill="none" stroke="hsl(180, 100%, 50%)" stroke-width="1"
            stroke-dasharray="2 8" opacity=".24"/>
    <g class="cube-spin" stroke-linejoin="round">
        <polygon points="300,104 383,151 300,199 217,151" fill="hsl(180, 100%, 50%)" fill-opacity=".12"
                 stroke="hsl(180, 100%, 50%)" stroke-width="3"/>
        <polygon points="217,151 300,199 300,294 217,246" fill="hsl(180, 100%, 50%)" fill-opacity=".06"
                 stroke="hsl(180, 100%, 50%)" stroke-width="3"/>
        <polygon points="383,151 300,199 300,294 383,246" fill="hsl(300, 100%, 55%)" fill-opacity=".1"
                 stroke="hsl(300, 100%, 55%)" stroke-width="3"/>
        <path d="M300 104v95m83-48-83 48-83-48m83 48v95" fill="none" stroke="white" stroke-width="2"
              opacity=".8"/>
    </g>
</svg>
