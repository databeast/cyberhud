<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
    <rect width="600" height="400" fill="hsl(220, 10%, 12%)"/>
    <rect x="20" y="20" width="560" height="360" fill="none" stroke="hsl(180, 100%, 50%)" stroke-width="2"
          stroke-dasharray="8 4" rx="4"/>
    <!-- Terminal window -->
    <rect x="100" y="80" width="400" height="240" rx="6" fill="hsl(220, 12%, 8%)" stroke="hsl(180, 100%, 50%)"
          stroke-width="1"/>
    <!-- Terminal title bar -->
    <rect x="100" y="80" width="400" height="24" rx="6" fill="hsl(220, 10%, 15%)"/>
    <circle cx="118" cy="92" r="5" fill="hsl(0, 70%, 50%)" opacity="0.7"/>
    <circle cx="134" cy="92" r="5" fill="hsl(45, 70%, 50%)" opacity="0.7"/>
    <circle cx="150" cy="92" r="5" fill="hsl(120, 70%, 40%)" opacity="0.7"/>
    <!-- Terminal text lines -->
    <text x="120" y="125" font-family="monospace" font-size="11" fill="hsl(120, 60%, 50%)">$ cyberhudctl mode set
        plasma
    </text>
    <text x="120" y="145" font-family="monospace" font-size="11" fill="hsl(0, 0%, 50%)">→ display:0 mode changed to
        plasma
    </text>
    <text x="120" y="170" font-family="monospace" font-size="11" fill="hsl(120, 60%, 50%)">$ cyberhudctl freeze
        --display 1
    </text>
    <text x="120" y="190" font-family="monospace" font-size="11" fill="hsl(0, 0%, 50%)">→ display:1 frozen</text>
    <text x="120" y="215" font-family="monospace" font-size="11" fill="hsl(120, 60%, 50%)">$ cyberhudctl status</text>
    <text x="120" y="235" font-family="monospace" font-size="11" fill="hsl(180, 100%, 50%)">display:0 plasma running
    </text>
    <text x="120" y="255" font-family="monospace" font-size="11" fill="hsl(300, 100%, 55%)">display:1 bokeh frozen
    </text>
    <!-- Blinking cursor -->
    <rect x="120" y="270" width="7" height="12" fill="hsl(180, 100%, 50%)" opacity="0.7"/>
    <text x="300" y="350" text-anchor="middle" font-family="monospace" font-size="13" fill="hsl(0, 0%, 45%)">RUNTIME
        CONTROL
    </text>
</svg>
