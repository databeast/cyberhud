name: docs

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'ghpages/**'
      - 'display/modes/**'
      - 'tools/docsnap/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'ghpages/**'
      - 'display/modes/**'
      - 'tools/docsnap/**'
      - '.github/workflows/docs.yml'

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - run: pip install -r ghpages/requirements.txt
      - run: make generate
      - run: make snapshots
      - run: make collect-snapshots
      - run: make generate-gallery
      - run: mkdocs build --strict --config-file ghpages/mkdocs.yml
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: ghpages/site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
