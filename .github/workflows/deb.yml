name: build-deb

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Override package version (defaults to tag without v, or 0.1.0-dev.<run number>)"
        required: false
        type: string

jobs:
  build-deb:
    name: Build ${{ matrix.arch }} .deb
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [ arm64, amd64 ]
    permissions:
      contents: read
    env:
      DEBIAN_FRONTEND: noninteractive
    outputs:
      package_version: ${{ steps.vars.outputs.version }}
      package_release: ${{ steps.vars.outputs.release }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Derive package metadata
        id: vars
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            version="${{ github.event.inputs.version }}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.1.0-dev.${GITHUB_RUN_NUMBER}"
          fi

          release="1"

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "release=${release}" >> "$GITHUB_OUTPUT"

      - name: Install packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential debhelper dpkg-dev fakeroot golang-go
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            sudo apt-get install -y crossbuild-essential-arm64
          fi

      - name: Generate code
        run: make generate

      - name: Run tests
        run: go test ./...

      - name: Build ${{ matrix.arch }} Debian package
        run: |
          chmod +x debian/rules debian/cyberhud.config debian/cyberhud.postinst debian/cyberhud.prerm debian/cyberhud.postrm
          make deb \
            VERSION="${{ steps.vars.outputs.version }}" \
            RELEASE="${{ steps.vars.outputs.release }}" \
            ARCH="${{ matrix.arch }}"

      - name: Upload Debian artifact
        uses: actions/upload-artifact@v7
        with:
          name: cyberhud-deb-${{ matrix.arch }}
          path: dist/*.deb
          if-no-files-found: error

  release:
    name: Publish tagged release assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-deb
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all Debian artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: cyberhud-deb-*
          path: dist
          merge-multiple: true

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.deb
          generate_release_notes: true
