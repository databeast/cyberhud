site_name: CyberHUD Documentation
site_url: https://databeast.github.io/cyberhud/
repo_url: https://github.com/databeast/cyberhud
repo_name: databeast/cyberhud

theme:
  name: material
  features:
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search

exclude_docs: |
  display-modes/img/**/_gallery.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - toc:
      permalink: true

nav:
  - Home: index.md
  - FAQ: faq.md
  - Getting Started:
      - getting-started/index.md
      - Setup: getting-started/setup.md
      - Hardware Identification: getting-started/hardware.md
      - Supported Hardware:
          - Waveshare Displays:
              - '2.23" OLED HAT': getting-started/waveshare-2-23-oled-hat.md
              - '1.44" LCD HAT': getting-started/waveshare-1-44-lcd-hat.md
              - 'Zero LCD HAT (A)': getting-started/waveshare-zero-lcd-hat-a.md
              - '1.3" OLED HAT': getting-started/waveshare-1-3-oled-hat.md
              - '1.3" LCD HAT': getting-started/waveshare-1-3hat.md
              - '2.2" LCD': getting-started/waveshare-2-2.md
              - '4.26" E-Paper': getting-started/waveshare-4-26-epaper.md
              - Triple Screen: getting-started/waveshare-triple-screen.md
          - Adafruit Displays:
              - '15×7 CharliePlex': getting-started/adafruit-15x7-charlieplex.md
              - '2.13" E-Paper': getting-started/adafruit-2-13-ssd1680.md
              - '4120 CharliePlex': getting-started/adafruit-4120-charlieplex.md
          - ST7789 Displays:
              - '240×135': getting-started/st7789-240x135.md
              - '240×240': getting-started/st7789-240x240.md
              - '320×240': getting-started/st7789-320x240.md
      - Regions: getting-started/regions.md
